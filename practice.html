<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="rl-build" content="8909fd4efd">
  <meta name="theme-color" content="#0f1110">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Practice - ReactionLab</title>
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
  <script defer src="assets/vendor/katex/katex.min.js"></script>
  <script defer src="assets/vendor/katex/mhchem.min.js"></script>
  <script>try{var d=document.documentElement,t=localStorage.getItem('rl.theme')||'dark';d.dataset.theme=t;if(localStorage.getItem('rl.sb')==='1')d.classList.add('sb-collapsed')}catch(e){}document.documentElement.classList.add('loading');setTimeout(function(){document.documentElement.classList.remove('loading')},12000)</script>
  <link rel="stylesheet" href="assets/css/style.css?v=8909fd4efd">
  <script defer src="data/reactions.js?v=8909fd4efd"></script>
  <script defer src="data/chains.js?v=8909fd4efd"></script>
  <script defer src="assets/js/core.js?v=8909fd4efd"></script>
  <script type="module" src="assets/js/cloud.js?v=8909fd4efd"></script>
  <script defer src="assets/js/router.js?v=8909fd4efd"></script>
  <script defer src="assets/js/practice.js?v=8909fd4efd"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation"></aside>
    <main class="main">

      <section class="panel soft" style="padding:16px 20px">
        <div class="filter-bar">
          <div class="tabs" id="modeTabs">
            <button class="tab" data-mode="free">Identify (free text)</button>
            <button class="tab" data-mode="mcq">MCQ quiz</button>
            <button class="tab" data-mode="chain">Reaction chains</button>
          </div>
          <select class="select" id="fExam"><option value="all">Both exams</option><option>JEE Main</option><option>JEE Advanced</option></select>
          <select class="select" id="fDiff"><option value="all">Any difficulty</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
          <span class="small muted" id="poolInfo"></span>
        </div>
        <div class="chips chapter-chips" id="fCategory" aria-label="Chapters (select one or more)"></div>
      </section>

      <!-- ============ FREE-TEXT MODE ============ -->
      <div id="freeMode" class="grid practice-grid">
        <section class="panel">
          <div class="panel-head">
            <h2>Get problem</h2>
            <div class="tabs" id="askTabs" role="tablist" aria-label="Question style">
              <button class="tab" data-ask="full" type="button">Name &amp; reagent</button>
              <button class="tab" data-ask="product" type="button">Predict product</button>
            </div>
            <button class="btn sm" id="hintBtn"></button>
            <button class="icon-btn dark" id="nextBtn" title="Next random reaction (N)"></button>
          </div>
          <div class="q-layout">
            <div class="q-left">
            <div class="small muted" style="margin-bottom:10px" id="qPrompt"></div>
            <div class="equation-box eq-fit" id="qEq"></div>
            <div id="hintBox" class="small" style="margin-top:12px"></div>
            <div id="scoreBox" style="margin-top:18px"></div>
            </div>
            <div class="q-right">
          <form id="answerForm" class="grid" style="gap:14px" autocomplete="off">
            <div class="field" id="fName"><label for="aName">Reaction name</label><input class="input" id="aName" placeholder="e.g. Aldol condensation"></div>
            <div class="field" id="fReagent"><label for="aReagent">Reagent / catalyst / conditions</label><input class="input" id="aReagent" placeholder="e.g. dil. NaOH, heat"></div>
            <div class="field"><label for="aOther">Product &amp; other important info <span class="muted">(optional)</span></label><textarea class="textarea" id="aOther" placeholder="e.g. β-hydroxy aldehyde; needs α-hydrogen…"></textarea></div>
            <div class="chips">
              <button type="submit" class="btn dark" id="checkBtn"></button>
              <button type="button" class="btn lav" id="revealBtn"></button>
              <span class="small muted" style="align-self:center"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> check · <kbd>R</kbd> reveal · <kbd>N</kbd> next</span>
            </div>
          </form>
            </div>
          </div>
        </section>

        <section class="panel" id="answerPanel">
          <div class="panel-head"><h2>Answer</h2><span class="small muted" id="sessionInfo"></span></div>
          <div id="answerBox"></div>
        </section>
      </div>

      <!-- ============ MCQ MODE ============ -->
      <div id="chainMode" class="hidden">
        <section class="panel" id="chainPanel"></section>
      </div>

      <div id="mcqMode" class="hidden">
        <section class="panel" id="mcqSetup">
          <div class="panel-head"><h2>Generate a quick MCQ quiz</h2></div>
          <p class="muted" style="margin-top:-8px">Randomised questions - identify the reaction, pick the reagent, or predict the product. Distractors come from the same chapter where possible.</p>
          <div class="chips" style="margin:18px 0" id="qCount">
            <button class="chip" data-n="5">5 questions</button><button class="chip active" data-n="10">10 questions</button>
            <button class="chip" data-n="20">20 questions</button><button class="chip" data-n="30">30 questions</button>
          </div>
          <div class="chips" style="margin-bottom:22px" id="qTypes">
            <button class="chip active" data-t="name">Name the reaction</button>
            <button class="chip active" data-t="nameFromReagent">Which reaction (reagent hidden)</button>
            <button class="chip active" data-t="reagent">Pick the reagent</button>
            <button class="chip active" data-t="product">Predict the product (reactant + reagent given)</button>
          </div>
          <button class="btn start" id="startQuiz"></button>
        </section>
        <section class="panel hidden" id="mcqRun"></section>
      </div>
    </main>
  </div>
</body>
</html>
